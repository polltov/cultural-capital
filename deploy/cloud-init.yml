#cloud-config
# Первичная настройка облачного сервера в Селектеле (Ubuntu 24.04). Весь файл вставляется в поле
# «Пользовательские данные» (User data) при создании сервера — README, «Сервер в Селектеле».
# Перед вставкой замените строку ssh-ed25519 … на ПУБЛИЧНЫЙ ключ для выкладки (deploy_key.pub).
#
# Что делает: ставит Docker, создаёт пользователя deploy (под ним работает сайт и заходит GitHub Actions),
# открывает наружу только SSH, HTTP и HTTPS, включает автоматические обновления безопасности, защиту SSH (fail2ban)
# и файл подкачки.

timezone: Etc/UTC
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - docker-buildx
  - python3
  - ufw
  - unattended-upgrades
  # блокирует подбор паролей к SSH, как на сервере сайта гимназии
  - fail2ban

users:
  - default
  - name: deploy
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 ЗАМЕНИТЕ_НА_СОДЕРЖИМОЕ_deploy_key.pub deploy

write_files:
  # Зеркало Docker Hub (если сам Docker Hub недоступен, образы node, caddy, postgres берутся оттуда)
  # и ограничение журналов контейнеров, чтобы они не заняли весь диск.
  - path: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": ["https://mirror.gcr.io"],
        "log-driver": "local",
        "log-opts": { "max-size": "20m", "max-file": "5" }
      }

# Сайт, база и HTTPS занимают около 0,5 ГБ, а сборки на сервере нет (образ собирает GitHub Actions); подкачка страхует
# сервер с 1 ГБ памяти — и разовую сборку образа tools для переезда данных.
swap:
  filename: /swapfile
  size: 2G

runcmd:
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy -m 750 /home/deploy/app
  - systemctl enable docker
  - systemctl restart docker
  # SSH — номером порта, а не профилем OpenSSH: на сервере 2026-11-15 правило по профилю не открыло порт 22, и в
  # сервер нельзя было зайти (ping и порт 80 отвечали, 22 молчал для всех)
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
  # итог настройки — в системный журнал сервера (панель Селектела → сервер → Syslog): видно без входа на сервер
  - sh -c '{ echo "== ufw"; ufw status verbose; echo "== порты"; ss -ltn; echo "== docker"; docker --version; docker compose version; echo "== deploy"; id deploy; } > /dev/console 2>&1'
